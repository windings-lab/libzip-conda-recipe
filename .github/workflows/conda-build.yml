name: conda-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CONDA_TOOLS_PREFIX: ${{ github.workspace }}/.conda-tools

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: ./bootstrap.sh
            shell: bash
          - os: windows-latest
            script: ./bootstrap.ps1
            shell: pwsh

    steps:
      - uses: actions/checkout@v4

      # only the package cache is restored; the tool env is rebuilt from it
      - uses: actions/cache@v4
        with:
          path: ${{ env.CONDA_TOOLS_PREFIX }}/pkgs
          key: conda-pkgs-${{ matrix.os }}-${{ hashFiles('meta.yaml', 'conda_build_config.yaml') }}
          restore-keys: conda-pkgs-${{ matrix.os }}-

      - name: Build and test the package
        shell: ${{ matrix.shell }}
        run: ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: libzip-${{ matrix.os }}
          path: build_artifacts/*/*.conda
          if-no-files-found: error

  upload:
    name: upload to anaconda.org
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: build_artifacts

      # --skip-existing keeps this idempotent across pushes
      - name: Upload
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          if [ -z "${ANACONDA_API_TOKEN}" ]; then
            echo "ANACONDA_API_TOKEN is not set" >&2
            exit 1
          fi
          curl -fsSL https://micro.mamba.pm/api/micromamba/linux-64/latest |
            tar -xj bin/micromamba
          ./bin/micromamba create -y -p ./anaconda-client-env \
            -c conda-forge --override-channels anaconda-client
          find build_artifacts -name '*.conda' -print -exec \
            ./anaconda-client-env/bin/anaconda org upload \
              --skip-existing --no-progress {} +
