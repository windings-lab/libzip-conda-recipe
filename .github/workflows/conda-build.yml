name: conda-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Build and test the package
        run: ./bootstrap.sh

      - uses: actions/upload-artifact@v4
        with:
          name: libzip-${{ matrix.os }}
          path: build_artifacts/*/*.conda
          if-no-files-found: error

  upload:
    name: upload to anaconda.org
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: build_artifacts

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Install anaconda-client
        run: conda install -y -n base anaconda-client

      # --skip-existing keeps this idempotent; conda run avoids PATH activation
      - name: Upload
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          if [ -z "${ANACONDA_API_TOKEN}" ]; then
            echo "ANACONDA_API_TOKEN is not set" >&2
            exit 1
          fi
          find build_artifacts -name '*.conda' -print -exec \
            conda run -n base --no-capture-output \
              anaconda org upload --skip-existing --no-progress {} +
