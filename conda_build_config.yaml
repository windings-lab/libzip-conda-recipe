c_compiler:
  - gcc                         # [linux]
  - clang                       # [osx]
  - vs2022                      # [win]

cxx_compiler:
  - gxx                         # [linux]
  - clangxx                     # [osx]
  - vs2022                      # [win]

c_stdlib:
  - sysroot                     # [linux]
  - macosx_deployment_target    # [osx]
  - vs                          # [win]

c_stdlib_version:
  - 2.17                        # [linux]
  - 10.13                       # [osx and x86_64]
  - 11.0                        # [osx and arm64]

# libcurl, and so cmake, is not built against openssl 4 yet
openssl:
  - '3'
